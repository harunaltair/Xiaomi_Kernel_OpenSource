name: Build Poco F6 Mutan Kernel

on:
  push:
    branches: [ "peridot-u-oss" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Mutan Extreme Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'peridot-u-oss'
          fetch-depth: 1

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: clang-15.0.7-20260208

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf \
            libssl-dev libxml2-utils lzop python3 python-is-python3 zip zlib1g-dev \
            llvm clang lld libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain && cd toolchain
          curl -L --retry 3 --retry-delay 5 -o clang.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz"
          tar -xf clang.tar.gz
          rm -f clang.tar.gz

      - name: Add Toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Sanitize Xiaomi OSS Source
        run: |
          set -e
          echo "Membersihkan referensi hwid yang rusak..."
          sed -i '/source "drivers\/misc\/hwid\/Kconfig"/d' drivers/misc/Kconfig || true
          sed -i '/obj-y += hwid\//d' drivers/misc/Makefile || true
          echo "Sanitasi selesai."

      - name: Setup KernelSU Next
        run: |
          set -e
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next drivers/ksu_tmp
          if [ -f "drivers/ksu_tmp/kernel/Kconfig" ]; then
            mv drivers/ksu_tmp/kernel drivers/kernelsu-next
            rm -rf drivers/ksu_tmp
          else
            mv drivers/ksu_tmp drivers/kernelsu-next
          fi
          if ! grep -q "kernelsu-next" drivers/Makefile; then
            echo "obj-y += kernelsu-next/" >> drivers/Makefile
          fi
          if ! grep -q "kernelsu-next" drivers/Kconfig; then
            sed -i '$i source "drivers/kernelsu-next/Kconfig"' drivers/Kconfig
          fi

      - name: Kernel Config Setup
        run: |
          set -e
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/gki_defconfig"
          fi
          echo "TARGET_DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

          set_config() {
            sed -i "/^$1/d" $DEFCONFIG || true
            echo "$1=$2" >> $DEFCONFIG
          }

          # --- FIX BPF VERIFIER & STACK LIMIT ---
          set_config CONFIG_FRAME_WARN 2560
          set_config CONFIG_WERROR n

          # --- FIX ERROR 2: DISABLE TRACING ---
          set_config CONFIG_FTRACE n
          set_config CONFIG_TRACING n
          set_config CONFIG_FUNCTION_TRACER n
          set_config CONFIG_STACK_TRACER n
          set_config CONFIG_DYNAMIC_FTRACE n

          # Core Features
          set_config CONFIG_KSU y
          set_config CONFIG_KSU_NEXT y
          set_config CONFIG_KSU_HIDE_PROCFS y
          set_config CONFIG_OVERLAY_FS y
          set_config CONFIG_LTO_CLANG_THIN y
          
          # Networking & Performance
          set_config CONFIG_TCP_CONG_BBR y
          set_config CONFIG_DEFAULT_TCP_CONG bbr
          set_config CONFIG_NET_SCH_FQ y
          set_config CONFIG_HZ_300 y
          set_config CONFIG_BPF_SYSCALL y
          set_config CONFIG_ZRAM_DEF_COMP_LZ4 y

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          
          rm -rf out && mkdir -p out
          
          DEFCONFIG_BASENAME=$(basename "$TARGET_DEFCONFIG")
          make O=out ARCH=arm64 $DEFCONFIG_BASENAME
          
          # Pastikan config baru diterapkan tanpa hambatan
          make O=out ARCH=arm64 LLVM=1 CC=clang olddefconfig
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 LLVM=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            Image.gz 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package AnyKernel3
        run: |
          set -e
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "❌ Build Gagal: Image.gz tidak ditemukan di folder out"
            exit 1
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          
          cat > anykernel.sh << 'EOF'
          properties() {
          kernel.string=Mutan-Kernel-A16-NextGen
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          supported.versions=14 - 16
          }
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1
          . tools/ak3-core.sh
          split_boot
          if [ -f "split_img/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi
          EOF
          zip -r9 ../kernel-mutan.zip * -x '*.git*'

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Mutan-Kernel-Release
          path: kernel-mutan.zip
