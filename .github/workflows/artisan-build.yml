name: Build Poco F6 Next-Gen Artisan Kernel

on:
  push:
    branches: [ "peridot-u-oss" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Artisan Extreme Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'peridot-u-oss'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf \
          libssl-dev libxml2-utils lzop python3 python-is-python3 zip zlib1g-dev \
          llvm clang lld libelf-dev

      - name: Setup Toolchain (ZyCromerZ Clang 15)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Menggunakan link stabil Clang 15.0.7
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz
          tar -xf Clang-15.0.7-20260208.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Sanitize Xiaomi OSS Source (Hot-Patch)
        run: |
          set -e
          echo "Memperbaiki referensi Kconfig/Makefile yang rusak dari vendor..."
          # 1. Hapus referensi Kconfig yang mengarah ke folder hwid yang hilang
          sed -i '/source "drivers\/misc\/hwid\/Kconfig"/d' drivers/misc/Kconfig || true
          # 2. Hapus referensi Makefile agar compiler tidak mencoba mem-build folder hwid
          sed -i '/obj-y += hwid\//d' drivers/misc/Makefile || true
          echo "Sanitasi selesai."

      - name: Setup KernelSU Next (Enterprise Git Integration)
        run: |
          set -e # 1. Wajib ada: Pipeline berhenti detik ini juga jika ada error
          
          echo "1. Mengunduh Source KernelSU Next..."
          # Perbaikan URL ke organisasi resmi & gunakan --depth=1 agar clone super cepat (hemat waktu & bandwidth)
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu-next
          
          echo "2. Melakukan Hooking ke Kernel Tree (Makefile & Kconfig)..."
          # Mencegah injeksi ganda jika skrip dijalankan ulang
          if ! grep -q "kernelsu-next" drivers/Makefile; then
            echo "obj-y += kernelsu-next/" >> drivers/Makefile
          fi
          
          # Wajib disuntikkan agar 'make defconfig' tidak menghapus flag KSU kita
          if ! grep -q "kernelsu-next" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu-next/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu-next/Kconfig"' >> drivers/Kconfig
          fi
          
          echo "3. Menyuntikkan Konfigurasi KSU secara Aman..."
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"
          
          # Fungsi aman: Hapus config lama (jika ada) sebelum menyuntikkan yang baru
          set_config() {
            local KEY=$1
            local VAL=$2
            sed -i "/$KEY/d" "$DEFCONFIG" || true
            echo "$KEY=$VAL" >> "$DEFCONFIG"
          }
          
          set_config "CONFIG_KSU" "y"
          set_config "CONFIG_KSU_NEXT" "y"
          set_config "CONFIG_KSU_HIDE_PROCFS" "y"
          set_config "CONFIG_OVERLAY_FS" "y"
          
          echo "Integrasi Manual KernelSU Next Selesai Tanpa Cacat."

      - name: Artisan Extreme Gaming & Battery Optimizations
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"
          
          # 1. PERFORMANCE TUNING (-O3 & ThinLTO)
          sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y/g' $DEFCONFIG || true
          echo "CONFIG_LTO_CLANG_THIN=y" >> $DEFCONFIG
          
          # 2. LOG-STRIP (Anti-Stutter)
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/g' $DEFCONFIG || true
          echo "CONFIG_DEBUG_INFO=n" >> $DEFCONFIG
          find . -name "Makefile" -exec sed -i 's/-g//g' {} + || true
          
          # 3. THERMAL & DEEP SLEEP (Thermal 47°C)
          find drivers/power/supply/ -name "*.c" -exec sed -i 's/450/470/g' {} + || true
          {
            echo "CONFIG_ENERGY_MODEL=y"
            echo "CONFIG_CPU_IDLE=y"
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y"
          } >> $DEFCONFIG
          
          # 4. GAMING SCHEDULER
          echo "CONFIG_SCHED_WALT=y" >> $DEFCONFIG

      - name: Build Kernel Binary
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          
          mkdir -p out
          make O=out ARCH=arm64 vendor/peridot_user_defconfig
          
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      Image.gz

      - name: Package with AnyKernel3
        run: |
          set -e
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3
            sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh
            sed -i 's/kernel.string=.*/kernel.string=Artisan-NextGen-PocoF6/g' anykernel.sh
            zip -r ../Artisan-NextGen-Kernel.zip *
          else
            echo "Build Gagal: Image.gz tidak ditemukan!"
            exit 1
          fi

      - name: Upload Artisan Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Artisan-NextGen-Kernel
          path: Artisan-NextGen-Kernel.zip
          retention-days: 7
