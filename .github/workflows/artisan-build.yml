name: Build Poco F6 Next-Gen Artisan Kernel

on:
  push:
    branches: [ "peridot-u-oss" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Artisan Extreme Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'peridot-u-oss'
          fetch-depth: 1

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: clang-15.0.7-20260208

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf \
          libssl-dev libxml2-utils lzop python3 python-is-python3 zip zlib1g-dev \
          llvm clang lld libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Toolchain (ZyCromerZ Clang 15)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain && cd toolchain

          curl -L \
            --retry 3 \
            --retry-delay 5 \
            -o clang.tar.gz \
            "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz"

          FILESIZE=$(stat -c%s clang.tar.gz)
          echo "Downloaded: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: Download gagal, isi file:"
            cat clang.tar.gz
            exit 1
          fi

          tar -xf clang.tar.gz
          rm -f clang.tar.gz
          echo "Clang ready: $(bin/clang --version | head -1)"

      - name: Add Toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Sanitize Xiaomi OSS Source (Hot-Patch)
        run: |
          set -e
          echo "Memperbaiki referensi Kconfig/Makefile yang rusak dari vendor..."
          sed -i '/source "drivers\/misc\/hwid\/Kconfig"/d' drivers/misc/Kconfig || true
          sed -i '/obj-y += hwid\//d' drivers/misc/Makefile || true
          echo "Sanitasi selesai."

      - name: Setup KernelSU Next
        run: |
          set -e

          echo "1. Mengunduh Source KernelSU Next..."
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next drivers/kernelsu-next

          echo "2. Verifikasi struktur folder KSU..."
          if [ -d "drivers/kernelsu-next/kernel" ]; then
            KSU_MAKEFILE_PATH="kernelsu-next/kernel/"
            KSU_KCONFIG_PATH="drivers/kernelsu-next/kernel/Kconfig"
          else
            KSU_MAKEFILE_PATH="kernelsu-next/"
            KSU_KCONFIG_PATH="drivers/kernelsu-next/Kconfig"
          fi
          echo "KSU path: $KSU_MAKEFILE_PATH"

          echo "3. Hooking ke Kernel Tree..."
          if ! grep -q "kernelsu-next" drivers/Makefile; then
            echo "obj-y += $KSU_MAKEFILE_PATH" >> drivers/Makefile
          fi

          if ! grep -q "kernelsu-next" drivers/Kconfig; then
            sed -i "/endmenu/i source \"$KSU_KCONFIG_PATH\"" drivers/Kconfig || \
            echo "source \"$KSU_KCONFIG_PATH\"" >> drivers/Kconfig
          fi

          echo "4. Menyuntikkan Konfigurasi KSU..."
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"

          set_config() {
            local KEY=$1
            local VAL=$2
            sed -i "/^$KEY/d" "$DEFCONFIG" || true
            echo "$KEY=$VAL" >> "$DEFCONFIG"
          }

          set_config "CONFIG_KSU" "y"
          set_config "CONFIG_KSU_NEXT" "y"
          set_config "CONFIG_KSU_HIDE_PROCFS" "y"
          set_config "CONFIG_OVERLAY_FS" "y"

          echo "Integrasi KernelSU Next selesai."

      - name: Artisan Optimizations
        run: |
          set -e
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"

          set_config() {
            local KEY=$1
            local VAL=$2
            sed -i "/^$KEY/d" "$DEFCONFIG" || true
            echo "$KEY=$VAL" >> "$DEFCONFIG"
          }

          echo "=== 1. Performance (-O3 & ThinLTO) ==="
          sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y/g' $DEFCONFIG || true
          set_config "CONFIG_LTO_CLANG_THIN" "y"

          echo "=== 2. Debug Strip (defconfig only) ==="
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/g' $DEFCONFIG || true
          sed -i '/^CONFIG_DEBUG_INFO/d' $DEFCONFIG || true
          set_config "CONFIG_DEBUG_INFO_NONE" "y"
          set_config "CONFIG_DEBUG_INFO" "n"
          set_config "CONFIG_KALLSYMS" "n"
          set_config "CONFIG_FTRACE" "n"

          echo "=== 3. Power & Thermal ==="
          set_config "CONFIG_ENERGY_MODEL" "y"
          set_config "CONFIG_CPU_IDLE" "y"
          set_config "CONFIG_CPU_FREQ_GOV_SCHEDUTIL" "y"

          echo "=== 4. PELT Optimization (Pengganti WALT) ==="
          # PELT sudah native di kernel, tidak perlu source eksternal
          # WALT dimatikan karena source-nya incomplete di OSS branch ini
          set_config "CONFIG_SCHED_WALT" "n"
          set_config "CONFIG_HZ_300" "y"
          set_config "CONFIG_NO_HZ_IDLE" "y"
          set_config "CONFIG_NO_HZ_FULL" "n"
          # PREEMPT_DYNAMIC lebih aman untuk HyperOS 3 (driver Qualcomm tidak semua thread-safe)
          set_config "CONFIG_PREEMPT_DYNAMIC" "y"
          set_config "CONFIG_CPU_FREQ_GOV_SCHEDUTIL" "y"

          echo "=== 5. Network Optimization ==="
          set_config "CONFIG_TCP_CONG_BBR" "y"
          set_config "CONFIG_DEFAULT_TCP_CONG" "bbr"
          set_config "CONFIG_NET_SCH_FQ" "y"
          set_config "CONFIG_TCP_ECN" "y"
          set_config "CONFIG_BPF_SYSCALL" "y"

          echo "=== 6. Memory Optimization ==="
          set_config "CONFIG_ZRAM_DEF_COMP_LZ4" "y"
          # KSM dinonaktifkan — Android 16 deprecated + Play Integrity concern
          set_config "CONFIG_KSM" "n"
          # ZSWAP dinonaktifkan — konflik dengan HyperMemory milik HyperOS 3
          set_config "CONFIG_ZSWAP" "n"
          set_config "CONFIG_ZSWAP_COMPRESSOR_DEFAULT_LZ4" "n"

          echo "=== 7. Security ==="
          set_config "CONFIG_SECCOMP" "y"
          set_config "CONFIG_SECCOMP_FILTER" "y"

          echo "Optimasi selesai."

      - name: Build Kernel Binary
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          mkdir -p out

          echo "1. Generate Base Defconfig..."
          make O=out ARCH=arm64 vendor/peridot_user_defconfig

          echo "2. Update Config (Non-Interactive)..."
          make O=out ARCH=arm64 LLVM=1 CC=clang olddefconfig

          echo "3. Kompilasi Utama..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz

      - name: Package with AnyKernel3 (Mutan Edition)
        run: |
          set -e
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3
            
            # Identitas Device
            sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh
            
            # NAMA YANG MUNCUL DI SETTINGS HP
            sed -i 's/kernel.string=.*/kernel.string=Mutan-Kernel-A16-NextGen/g' anykernel.sh
            
            # NAMA FILE .ZIP HASILNYA
            zip -r9 ../Mutan-Kernel-Peridot-A16.zip * -x '*.git*'
          else
            echo "Build Gagal: Image.gz ga ada, cek log di atas!"
            exit 1
          fi

      - name: Upload Mutan Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Mutan-Kernel-A16-Package
          path: Mutan-Kernel-Peridot-A16.zip
          retention-days: 7
