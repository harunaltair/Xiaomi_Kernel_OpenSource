name: Build Poco F6 Next-Gen Artisan Kernel

on:
  push:
    branches: [ "peridot-u-oss" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'peridot-u-oss'
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core gnupg gperf libssl-dev libxml2-utils lzop python3 python-is-python3 zip zlib1g-dev llvm clang lld libelf-dev

      - name: Setup Toolchain (ZyCromerZ Clang 15)
        run: |
          mkdir -p toolchain
          cd toolchain
          # Menggunakan link stabil Clang 15.0.7 rilis Februari 2026
          curl -LO https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208-release.tar.gz
          tar -xf Clang-15.0.7-20260208-release.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Setup KernelSU Next
        run: |
          # Ambil skrip setup KSU Next langsung dari main branch
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main
          
          # Injeksi config ke defconfig Xiaomi Poco F6
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_KSU_HIDE_PROCFS=y"
            echo "CONFIG_OVERLAY_FS=y"
          } >> $DEFCONFIG

      - name: Artisan Next-Gen Optimizations
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"
          
          # 1. Optimasi Performa (O3 & LTO)
          sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y/g' $DEFCONFIG || true
          echo "CONFIG_LTO_CLANG_THIN=y" >> $DEFCONFIG
          
          # 2. Thermal Tuning (47°C) - Mencari file di folder power supply
          find drivers/power/supply/ -name "*.c" -exec sed -i 's/450/470/g' {} + || true
          
          # 3. Disable Debugging untuk meringankan beban CPU
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/g' $DEFCONFIG || true
          echo "CONFIG_DEBUG_INFO=n" >> $DEFCONFIG

      - name: Build Kernel Binary
        run: |
          # Set environment variables untuk kompilasi ZyCromerZ
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          
          mkdir -p out
          
          # Langkah 1: Generate Config
          make O=out ARCH=arm64 vendor/peridot_user_defconfig
          
          # Langkah 2: Proses Kompilasi Utama
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      Image.gz

      - name: Package with AnyKernel3
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3
            sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh
            sed -i 's/kernel.string=.*/kernel.string=Artisan-NextGen-PocoF6/g' anykernel.sh
            zip -r ../Artisan-NextGen-Kernel.zip *
          else
            echo "Kompilasi Gagal: File Image.gz tidak ditemukan!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artisan-NextGen-Kernel
          path: Artisan-NextGen-Kernel.zip
