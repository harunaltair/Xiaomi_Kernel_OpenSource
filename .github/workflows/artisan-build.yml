name: Build Poco F6 Next-Gen Artisan Kernel

on:
  push:
    branches: [ "peridot-u-oss" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Artisan Extreme Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: 'MiCode/Xiaomi_Kernel_OpenSource'
          ref: 'peridot-u-oss'
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git-core gnupg gperf \
          libssl-dev libxml2-utils lzop python3 python-is-python3 zip zlib1g-dev \
          llvm clang lld libelf-dev

      - name: Cache Static Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain-dir
          key: ${{ runner.os }}-clang-zycromerz-15.0.7

      - name: Setup Toolchain (ZyCromerZ Clang 15)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p toolchain-dir
          # Jangan cd, tetap di workspace agar struktur path aman
          TOOLCHAIN_URL="https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz"
          
          if ! curl -fSLO "$TOOLCHAIN_URL"; then
            echo "::error::Gagal mengunduh Toolchain."
            exit 1
          fi
          
          # Ekstrak langsung ke dalam direktori dan buang arsip
          tar -xzf Clang-15.0.7-20260208.tar.gz -C toolchain-dir
          rm *.tar.gz

      - name: Export Toolchain Path
        run: |
          # Cari direktori bin yang sebenarnya (mengantisipasi struktur subfolder)
          BIN_PATH=$(find $GITHUB_WORKSPACE/toolchain-dir -type d -name "bin" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::Direktori bin pada toolchain tidak ditemukan!"
            exit 1
          fi
          echo "$BIN_PATH" >> $GITHUB_PATH
          echo "Toolchain Path terdaftar: $BIN_PATH"

      - name: Setup KernelSU Next
        run: |
          set -e
          curl -fLSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main

      - name: Artisan Extreme Optimization Configs
        run: |
          set -e
          DEFCONFIG="arch/arm64/configs/vendor/peridot_user_defconfig"
          
          # Fungsi aman untuk menginjeksi atau memperbarui config
          set_config() {
            local KEY=$1
            local VAL=$2
            sed -i "/$KEY/d" "$DEFCONFIG" || true # Hapus jika sudah ada (mencegah duplikasi/konflik)
            echo "$KEY=$VAL" >> "$DEFCONFIG"
          }
          
          # --- KSU Next ---
          set_config "CONFIG_KSU" "y"
          set_config "CONFIG_KSU_NEXT" "y"
          set_config "CONFIG_KSU_HIDE_PROCFS" "y"
          set_config "CONFIG_OVERLAY_FS" "y"
          
          # --- Performance (O3 & LTO) ---
          set_config "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE" "y" # Pastikan base flag aktif
          sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y/g' "$DEFCONFIG" || true
          set_config "CONFIG_LTO_CLANG_THIN" "y"
          
          # --- Anti-Stutter (Disable Debug) ---
          set_config "CONFIG_DEBUG_KERNEL" "n"
          set_config "CONFIG_DEBUG_INFO" "n"
          
          # --- Power Management & Sched ---
          set_config "CONFIG_ENERGY_MODEL" "y"
          set_config "CONFIG_CPU_IDLE" "y"
          set_config "CONFIG_CPU_FREQ_GOV_SCHEDUTIL" "y"
          set_config "CONFIG_SCHED_WALT" "y"
          
          # Thermal Tuning (Aman jika tidak ditemukan)
          find drivers/power/supply/ -name "*.c" -type f -exec sed -i 's/450/470/g' {} + || true

      - name: Build Kernel Binary
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          # Path toolchain sudah di-export secara global di step sebelumnya
          
          mkdir -p out
          make O=out ARCH=arm64 vendor/peridot_user_defconfig
          
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      Image.gz

      - name: Package with AnyKernel3
        run: |
          set -e
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3
            sed -i 's/device.name1=.*/device.name1=peridot/g' anykernel.sh
            sed -i 's/kernel.string=.*/kernel.string=Artisan-NextGen-Extreme/g' anykernel.sh
            rm -rf .git
            zip -r9 ../Artisan-Extreme-Kernel.zip *
          else
            echo "::error::Build Gagal: Image.gz tidak ditemukan!"
            exit 1
          fi

      - name: Upload Artisan Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Artisan-Extreme-Kernel
          path: Artisan-Extreme-Kernel.zip
          retention-days: 7
